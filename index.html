<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADDAX Labs - Tech Buddy V1 Setup</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --accent-color: #00f2fe;
            --text-color: #ffffff;
            --text-muted: #8fa0c4;
            --input-bg: #1f2a45;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(0, 242, 254, 0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: var(--text-color);
            letter-spacing: 1px;
        }

        .brand {
            color: var(--accent-color);
            font-weight: bold;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0072ff, #00f2fe);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-connect {
            background: #22c55e;
            margin-bottom: 20px;
        }

        .status-box {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1><span class="brand">ADDAX</span> Labs</h1>
    <p class="subtitle">Configure your Tech Buddy V1 ecosystem</p>
    
    <div id="status" class="status-box">Status: Disconnected from hardware</div>
    <button id="connectBtn" class="btn btn-connect">1. Connect Tech Buddy</button>

    <div id="configFields" style="opacity: 0.5; pointer-events: none;">
        <div class="form-group">
            <label>Wi-Fi Network Name (SSID)</label>
            <input type="text" id="ssid" placeholder="Enter home Wi-Fi name">
        </div>

        <div class="form-group">
            <label>Wi-Fi Password</label>
            <input type="password" id="pass" placeholder="Enter Wi-Fi password">
        </div>

        <div class="form-group">
            <label>AI Provider URL</label>
            <input type="text" id="apiUrl" placeholder="https://openai.com">
        </div>

        <div class="form-group">
            <label>Private API Key</label>
            <input type="password" id="apiKey" placeholder="sk-...">
        </div>

        <div class="form-group">
            <label>AI Model Identifier</label>
            <input type="text" id="model" placeholder="e.g., gpt-4o-mini, gemini-2.5-flash">
        </div>

        <button id="saveBtn" class="btn">2. Flash Configuration</button>
    </div>
</div>

<script>
    let port;
    let writer;

    const connectBtn = document.getElementById('connectBtn');
    const saveBtn = document.getElementById('saveBtn');
    const statusDiv = document.getElementById('status');
    const configFields = document.getElementById('configFields');

    connectBtn.addEventListener('click', async () => {
        if ('serial' in navigator) {
            try {
                // Request a port from the user via the browser popup
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                statusDiv.innerText = "Status: Connected to Tech Buddy V1";
                statusDiv.style.color = "#22c55e";
                configFields.style.opacity = "1";
                configFields.style.pointerEvents = "auto";
                connectBtn.style.display = "none";
            } catch (err) {
                statusDiv.innerText = "Error: " + err.message;
                statusDiv.style.color = "#ef4444";
            }
        } else {
            alert("Web Serial API is not supported by your current browser. Please use Google Chrome or Microsoft Edge.");
        }
    });

    saveBtn.addEventListener('click', async () => {
        if (!port) return;

        // Collect form data values
        const data = {
            ssid: document.getElementById('ssid').value,
            pass: document.getElementById('pass').value,
            url: document.getElementById('apiUrl').value,
            key: document.getElementById('apiKey').value,
            model: document.getElementById('model').value
        };

        // Format as a single JSON line strings ending with a newline
        const jsonString = JSON.stringify(data) + "\n";
        
        try {
            const encoder = new TextEncoder();
            const writer = port.writable.getWriter();
            await writer.write(encoder.encode(jsonString));
            writer.releaseLock();
            
            statusDiv.innerText = "Configuration sent successfully! Buddy is restarting...";
            statusDiv.style.color = "#00f2fe";
        } catch (err) {
            statusDiv.innerText = "Write Error: " + err.message;
            statusDiv.style.color = "#ef4444";
        }
    });
</script>

</body>
</html>
